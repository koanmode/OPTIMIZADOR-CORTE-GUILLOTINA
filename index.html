<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPTIMIZADOR DE CORTE GUILLOTINA 2D - DATAWAVES</title>
    <link rel="stylesheet" href="style.css">
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .field-locked {
            background-color: #1a1a22 !important;
            color: #5c5c6e !important;
            border-color: #2e2e3a !important;
            cursor: not-allowed !important;
        }
        
        .btn-app {
            font-size: 11px !important;
            font-weight: 600 !important;
            letter-spacing: 0.5px !important;
            text-transform: uppercase !important;
            border: none !important;
            border-radius: 4px !important;
            padding: 6px 14px !important;
            cursor: pointer;
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        /* QUITADOR DE FLECHAS EN CAMPOS NUMÉRICOS */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { 
            -moz-appearance: textfield; 
        }

        /* ESTILO UNIFICADO DE CHECKBOX CLÁSICO */
        .checkbox-label {
            font-size: 11px;
            color: #c2c2d0;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 600;
            user-select: none;
        }
        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #b35500;
            cursor: pointer;
            margin: 0;
        }

        /* BOTONES ICONOS */
        .icon-btn {
            background: transparent !important;
            border: none !important;
            cursor: pointer;
            padding: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: filter 0.2s, opacity 0.2s;
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
            stroke: #b35500;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }
        .icon-btn:disabled {
            opacity: 0.3 !important;
            cursor: not-allowed !important;
        }
        .icon-btn:not(:disabled):hover svg {
            stroke: #e06b00 !important;
            filter: drop-shadow(0 0 2px rgba(224, 107, 0, 0.6));
        }

        .icon-btn.active-mode svg {
            stroke: #e06b00 !important;
            filter: drop-shadow(0 0 3px rgba(224, 107, 0, 0.8));
        }

        .btn-add-box {
            background-color: #23232c !important;
            border: 1px solid #b35500 !important;
            border-radius: 4px !important;
            width: 34px !important;
            height: 34px !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            padding: 0 !important;
        }
        .btn-add-box svg {
            width: 18px;
            height: 18px;
            stroke: #b35500;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }
        .btn-add-box:hover {
            background-color: #2a2a36 !important;
            border-color: #e06b00 !important;
        }

        /* PESTAÑAS MÚLTIPLES CHAPAS */
        .sheet-tab {
            background: #181820;
            border: 1px solid #2a2a36;
            color: #828292;
            padding: 8px 16px;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .sheet-tab.active {
            background: #1d1d24;
            color: #ffffff;
            border-bottom-color: #1d1d24;
            border-top: 2px solid #b35500;
        }
        .sheet-tab .close-tab {
            color: #616170;
            font-weight: bold;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .sheet-tab .close-tab:hover {
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.15);
        }

        /* INTERACCIÓN PIEZAS SVG Y SELECCIÓN MÚLTIPLE */
        .draggable-part {
            cursor: grab;
        }
        .draggable-part:hover rect {
            stroke: #ffffff !important;
            stroke-width: 2.5px !important;
        }
        .sheet-svg-canvas {
            user-select: none;
            touch-action: none;
        }
        #part-context-menu {
            position: fixed;
            display: none;
            background-color: #1d1d26;
            border: 1px solid #b35500;
            border-radius: 5px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75);
            z-index: 9999;
            min-width: 175px;
            padding: 4px 0;
            font-size: 11px;
            font-weight: 600;
        }
        .ctx-item {
            padding: 8px 14px;
            color: #e0e0ea;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s, color 0.15s;
        }
        .ctx-item:hover {
            background-color: #b35500;
            color: #ffffff;
        }
        .ctx-divider {
            height: 1px;
            background-color: #2e2e3d;
            margin: 4px 0;
        }
    </style>
</head>
<body style="background-color: #121217; color: #c2c2d0; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;">

    <!-- MENÚ CONTEXTUAL FLOTANTE PARA PIEZAS -->
    <div id="part-context-menu">
        <div class="ctx-item" id="ctx-rotate-cw">↻ GIRAR +90° (HORARIO)</div>
        <div class="ctx-item" id="ctx-rotate-ccw">↺ GIRAR -90° (ANTIHORARIO)</div>
        <div class="ctx-divider"></div>
        <div class="ctx-item" id="ctx-delete-part" style="color: #ff6b6b;">✕ QUITAR PIEZA DEL PLANO</div>
    </div>

    <!-- BARRA SUPERIOR HEADER -->
    <header style="background-color: #141419; border-bottom: 1px solid #282833; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 16px; font-weight: bold; letter-spacing: 1px; color: #ffffff; margin-right: 8px;">DATAWAVES <span style="color: #b35500;">GUILLOTINE OPTIMIZER 2D</span></span>
        </div>

        <div style="display: flex; align-items: center; gap: 14px;">
            <select id="saved-projects-select" class="form-control" style="width: 220px; height: 31px; font-size: 11px; padding: 4px 8px; background-color: #23232c; border: 1px solid #333342; color: #c2c2d0; border-radius: 4px;">
                <option value="">-- SELECCIONAR --</option>
            </select>

            <div style="display: flex; align-items: center; gap: 10px; border-left: 1px solid #282833; padding-left: 14px;">
                <button id="btn-update-project" class="icon-btn" title="Actualizar" disabled>
                    <svg viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.73-5.73"/></svg>
                </button>
                <button id="btn-save-project" class="icon-btn" title="Registrar" disabled>
                    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                </button>
                <button id="btn-delete-project" class="icon-btn" title="Eliminar" disabled>
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
                <input type="file" id="import-file-input" accept=".json" style="display: none;">
                <button id="btn-import-project" class="icon-btn" title="Importar">
                    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
                </button>
                <button id="btn-export-project" class="icon-btn" title="Exportar" disabled>
                    <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                </button>
                <button id="btn-colorblind-mode" class="icon-btn" title="Modo Daltónico">
                    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
        </div>
    </header>

    <div style="padding: 18px 20px;">
        
        <!-- CABECERA DEL PROYECTO -->
        <div class="card" style="background-color: #1d1d24; border: 1px solid #2a2a36; padding: 16px; border-radius: 6px; margin-bottom: 16px;">
            <div style="display: grid; grid-template-columns: 2fr auto 0.6fr 1fr 2.5fr 1.5fr 1.5fr; gap: 10px; align-items: end;">
                <div>
                    <label style="display: block; margin-bottom: 5px; font-size: 9px; color: #828292; font-weight: 600; text-transform: uppercase;">NOMBRE DEL PROYECTO</label>
                    <input type="text" id="project-name" class="form-control" placeholder="NOMBRE DEL PROYECTO">
                </div>
                <div style="width: 1px; background-color: #2a2a36; height: 100%; min-height: 45px;"></div>
                <div style="display:none;">
                    <label style="display: block; margin-bottom: 5px; font-size: 9px; color: #828292; font-weight: 600; text-transform: uppercase;">ESPESOR HOJA (KERF)</label>
                    <input type="number" id="blade-width" class="form-control" value="0" min="0">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-size: 9px; color: #828292; font-weight: 600; text-transform: uppercase;">ID</label>
                    <input type="text" id="doc-id" class="form-control" autocomplete="off">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-size: 9px; color: #828292; font-weight: 600; text-transform: uppercase;">OF</label>
                    <input type="text" id="doc-of" class="form-control field-locked" disabled readonly>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-size: 9px; color: #828292; font-weight: 600; text-transform: uppercase;">CLIENTE</label>
                    <input type="text" id="doc-cliente" class="form-control field-locked" disabled readonly>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-size: 9px; color: #828292; font-weight: 600; text-transform: uppercase;">OBRA</label>
                    <input type="text" id="doc-obra" class="form-control field-locked" disabled readonly>
                </div>
            </div>
        </div>

        <!-- MÓDULO MULTI-CHAPA CON PESTAÑAS -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div id="sheets-tabs-container" style="display: flex; gap: 4px; overflow-x: auto;">
                <!-- Pestañas dinámicas se renderizan aquí -->
            </div>
            <button id="btn-add-sheet" class="btn-app" style="background-color: #23232c; border: 1px solid #b35500 !important; color: #e06b00; margin-bottom: 1px; height: 32px;">
                + AGREGAR OTRA CHAPA
            </button>
        </div>

        <!-- TARJETA MÓDULO DE CHAPA ACTIVA -->
        <div class="card" style="background-color: #1d1d24; border: 1px solid #2a2a36; padding: 18px; border-radius: 0 6px 6px 6px; margin-bottom: 16px;">
            
            <!-- CONFIGURACIÓN DE LA CHAPA SELECCIONADA -->
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-bottom: 16px; background: #16161d; padding: 12px; border-radius: 4px; border: 1px solid #282833;">
                <div>
                    <label style="display: block; margin-bottom: 5px; font-size: 9px; color: #828292; font-weight: 600; text-transform: uppercase;">DESCRIPCIÓN DE LA CHAPA</label>
                    <input type="text" id="active-sheet-desc" class="form-control" placeholder="Ej: Chapa 1 - 1220x2440">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-size: 9px; color: #828292; font-weight: 600; text-transform: uppercase;">ANCHO CHAPA (mm)</label>
                    <input type="number" id="active-sheet-width" class="form-control" min="100">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-size: 9px; color: #828292; font-weight: 600; text-transform: uppercase;">ALTO CHAPA (mm)</label>
                    <input type="number" id="active-sheet-height" class="form-control" min="100">
                </div>
            </div>

            <!-- CARGA DE PIEZAS PARA ESTA CHAPA -->
            <div style="display: grid; grid-template-columns: 1fr auto 1.3fr; gap: 20px; align-items: start;">
                <div style="display: flex; flex-direction: column; gap: 14px;">
                    <div style="display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr auto; gap: 8px; align-items: end;">
                        <div>
                            <label style="display: block; margin-bottom: 5px; font-size: 10px; color: #9e9ea6; font-weight: 600;">PIEZA</label>
                            <input type="text" id="part-name" class="form-control" style="height: 34px;" placeholder="Ej: C1">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 5px; font-size: 10px; color: #9e9ea6; font-weight: 600;">ANCHO (mm)</label>
                            <input type="number" id="part-width" class="form-control" min="1" style="height: 34px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 5px; font-size: 10px; color: #9e9ea6; font-weight: 600;">ALTO (mm)</label>
                            <input type="number" id="part-height" class="form-control" min="1" style="height: 34px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 5px; font-size: 10px; color: #9e9ea6; font-weight: 600;">CANT.</label>
                            <input type="number" id="part-qty" class="form-control" min="1" style="height: 34px;">
                        </div>
                        <div style="display: flex; align-items: center; height: 34px;">
                            <button id="btn-add-part" class="btn-add-box" title="Agregar pieza a esta chapa">
                                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 6px;">
                        <div>
                            <button id="btn-optimize" class="btn-app" style="background-color: #b35500; color: #ffffff; height: 36px; padding: 0 22px !important; width: 100%;">CALCULAR GUILLOTINA (TODAS LAS CHAPAS)</button>
                        </div>
                        
                        <!-- BLOQUE DE CHECKBOXES REVISADO -->
                        <div style="display: flex; flex-direction: column; gap: 10px; background: #16161d; padding: 14px; border-radius: 4px; border: 1px solid #282833;">
                            <label class="checkbox-label">
                                <input type="checkbox" id="chk-no-problems">
                                SIMPLIFICAR CORTES (Alinear piezas con bordes de chapa)
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="chk-no-rotation">
                                LAS PIEZAS NO PUEDEN GIRAR (Orientación fija)
                            </label>
                        </div>
                    </div>
                </div>

                <div style="width: 1px; background-color: #2a2a36; height: 100%; min-height: 110px;"></div>

                <!-- TABLA DE PIEZAS DE LA CHAPA ACTIVA -->
                <div>
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background-color: #2d2c38; color: #a5a5b5;">
                                <th style="padding: 7px 10px; text-align: left; font-size: 10px; font-weight: 700;">PIEZA</th>
                                <th style="padding: 7px 10px; text-align: left; font-size: 10px; font-weight: 700;">ANCHO X LARGO</th>
                                <th style="padding: 7px 10px; text-align: center; font-size: 10px; font-weight: 700;">CANT.</th>
                                <th style="padding: 7px 10px; text-align: center; font-size: 10px; font-weight: 700;">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="parts-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TERCERA TARJETA: PROGRAMAS RESULTANTES -->
        <div class="card" style="background-color: #1d1d24; border: 1px solid #2a2a36; padding: 18px; border-radius: 6px;" id="results-card">
            <h4 style="margin: 0 0 12px 0; font-size: 12px; font-weight: 700; color: #c2c2d0; letter-spacing: 0.5px; text-transform: uppercase;">PROGRAMAS DE CORTE OPTIMIZADOS</h4>
            <div id="results-container" style="color: #616170; font-size: 11px; letter-spacing: 0.3px;">
                AGREGUE PIEZAS Y PRESIONE "CALCULAR GUILLOTINA" PARA GENERAR LOS DIBUJOS Y LISTADOS.
            </div>
        </div>

    </div>

    <script src="optimizer.js"></script>
    <script>
        // Lectura de datos ID, OF, Cliente, Obra
        const inputId = document.getElementById('doc-id');
        const inputOf = document.getElementById('doc-of');
        const inputCliente = document.getElementById('doc-cliente');
        const inputObra = document.getElementById('doc-obra');

        function limpiarCamposDependientes() {
            if (inputOf) inputOf.value = '';
            if (inputCliente) inputCliente.value = '';
            if (inputObra) inputObra.value = '';
        }

        inputId.addEventListener('input', function() {
            if (this.value.trim() === '') {
                limpiarCamposDependientes();
            } else if (!this.value.startsWith('ID:') && !/^\d*$/.test(this.value)) {
                this.value = this.value.replace(/[^\d]/g, '');
            }
        });

        inputId.addEventListener('paste', function(e) {
            e.preventDefault();
            const textoPegado = (e.clipboardData || window.clipboardData).getData('text').trim();

            const matchId = textoPegado.match(/ID\s*:\s*([^|]+)/i);
            const matchOf = textoPegado.match(/OF\s*:\s*([^|]+)/i);
            const matchCliente = textoPegado.match(/CLIENTE\s*:\s*([^|]+)/i);
            const matchObra = textoPegado.match(/OBRA\s*:\s*([^|]+)/i);

            if (matchId || matchOf) {
                if (matchId) {
                    let idLimpio = matchId[1].split('|')[0].trim();
                    inputId.value = idLimpio.replace(/[^\d]/g, '');
                }
                if (matchOf) inputOf.value = matchOf[1].split('|')[0].trim();
                if (matchCliente) inputCliente.value = matchCliente[1].split('|')[0].trim();

                if (matchObra) {
                    let obraBruta = matchObra[1].split('|')[0].trim();
                    inputObra.value = obraBruta.replace(/^[\d\s-]+/, '').trim();
                } else {
                    inputObra.value = '';
                }
            } else if (/^\d+$/.test(textoPegado)) {
                inputId.value = textoPegado;
                limpiarCamposDependientes();
            } else {
                inputId.value = textoPegado;
            }
        });
    </script>
</body>
</html>
